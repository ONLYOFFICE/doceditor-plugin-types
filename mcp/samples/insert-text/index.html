<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Insert Text Sample</title>
  <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
  <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
  <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
  <style>
    .content { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
    textarea { min-height: 60px; resize: vertical; }
  </style>
  <script type="text/javascript" src="scripts/code.js"></script>
</head>
<body>
  <div class="content">
    <label for="text">Paragraph text</label>
    <textarea id="text" class="form-control">Hello from the plugin</textarea>
    <button id="insert" class="btn-text-default">Insert paragraph</button>
  </div>
</body>
</html>
